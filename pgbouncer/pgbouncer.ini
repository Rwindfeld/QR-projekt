; Merge into existing PgBouncer install or use as-is with Docker (edoburu/pgbouncer)
; Docs: https://www.pgbouncer.org/config.html

[databases]
QR = host=postgres port=5432 dbname=QR
pgbouncer = host=postgres port=5432 dbname=pgbouncer

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
stats_users = pgbouncer_stats
admin_users = postgres
ignore_startup_parameters = extra_float_digits

; Logging (useful when debugging Alloy / connection issues)
log_connections = 1
log_disconnections = 1
