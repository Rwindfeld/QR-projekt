# Render Blueprint — permanent HTTPS URL for printed QR codes
# Deploy: https://dashboard.render.com → New → Blueprint → connect GitHub repo

databases:
  - name: qr-db
    databaseName: qr
    user: qr
    plan: free

services:
  # Unikt navn — "qr-cafe" var allerede en anden app på Render (404 på /scan)
  - type: web
    name: qr-spilcafe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: qr-db
          property: connectionString
      # BASE_URL sættes automatisk fra RENDER_EXTERNAL_URL i main.py
      - key: GRAFANA_ALLOY_TOKEN
        sync: false
      - key: GRAFANA_CLOUD_PROM_URL
        sync: false
      - key: GRAFANA_CLOUD_PROM_USER
        sync: false
